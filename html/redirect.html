<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect</title>
</head>
<body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, follow this <a href="{{path}}">link</a>.</p>
    <script>
        setTimeout(function() {
            window.location.href = "{{path}}";
        }, 100);
    </script>
</body>
</html>
