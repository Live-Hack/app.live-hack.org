<!DOCTYPE html>
<html lang="en">
<head>
    {{inject_head}}
</head>
<body>
{{inject_header}}
<main class="main">
    <div class="container">
        <div class="page-head page-head--row">
            <div>
                <h1 class="page-head__title">Scoreboard</h1>
                <p class="page-head__text">{{players}} players ranked. Ties go to whoever got there first.</p>
            </div>
            <div class="stats stats--compact">{{{me_box}}}</div>
        </div>
        <div class="tabs">{{{tabs}}}</div>
        <div class="table-wrap">
            <table class="table table--board">
                <thead><tr><th>#</th><th>Player</th><th class="num">Points</th><th class="num">Solves</th><th>Last solve</th></tr></thead>
                <tbody>{{{rows}}}</tbody>
            </table>
        </div>
        {{{pager}}}
    </div>
</main>
{{inject_footer}}
</body>
</html>
