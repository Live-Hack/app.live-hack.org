<header class="header">
    <div class="header__content">
        <div class="header__logo ms-n2">
            <a href="/" class="d-flex align-items-center gap-2 text-decoration-none header__brand">
                <img src="/assets/logo-white.png" alt="Live Hack logo" class="header__brand-logo">
                <span class="header__brand-text" style="color: white">
                    <h2 style="margin: 0;">Live Hack</h2>
                </span>
            </a>
        </div>

        <div class="header__menu">
            <ul class="header__nav">
                <li class="header__nav-item">
                    <a class="header__nav-link" href="/challenges">Challenges</a>
                </li>
                <li class="header__nav-item">
                    <a class="header__nav-link" href="/labs">Labs</a>
                </li>
                <li class="header__nav-item">
                    <a class="header__nav-link" href="/events">Events</a>
                </li>
                <li class="header__nav-item">
                    <a class="header__nav-link" href="/scoreboard">Scoreboard</a>
                </li>
            </ul>
        </div>

        <div class="header__actions">
            {{login_space}}
        </div>

        <button class="header__btn" type="button" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>
