{{inject_sign_open}}
<form class="sign__form" data-api="/api/v1/auth/login" data-redirect="{{next}}">
    {{inject_sign_logo}}
    <h1 class="sign__title">Sign in</h1>
    <div class="sign__group">
        <label class="sign__label" for="login">Username or email</label>
        <input id="login" name="login" class="sign__input" required autocomplete="username" autofocus>
    </div>
    <div class="sign__group">
        <label class="sign__label" for="password">Password</label>
        <input id="password" name="password" type="password" class="sign__input" required autocomplete="current-password">
    </div>
    <p class="form__msg" data-msg role="alert"></p>
    <button class="sign__btn" type="submit">Sign in</button>
    {{{register_link}}}
    <span class="sign__text">Forgot your password? Ask an organizer for a reset link.</span>
</form>
{{inject_sign_close}}
