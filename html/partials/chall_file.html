<a class="chall-file" href="{{href}}" download>
    <span class="chall-file__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10zm0 2.5L17.5 10H13zM12 18l-4-4h3v-3h2v3h3z"/></svg>
    </span>
    <span class="chall-file__info">
        <span class="chall-file__name">{{name}}</span>
        <span class="chall-file__meta">{{size}} · <span class="mono" title="SHA-256">{{sha}}</span></span>
    </span>
</a>
