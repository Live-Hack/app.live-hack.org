<a href="{{href}}" class="chall-grid-card{{solved_class}}">
    {{{solved_badge}}}
    <div class="chall-grid-card__header">
        <span class="chall-grid-card__cat {{cat_class}}">{{category}}</span>
        <span class="chall-grid-card__pts">{{points}} pts</span>
    </div>
    <h3 class="chall-grid-card__title">{{name}}</h3>
    <div class="chall-grid-card__footer">
        <span class="chall-grid-card__difficulty diff-{{difficulty}}">{{difficulty}}</span>
        <span class="chall-grid-card__meta">{{kind}} · {{solves}} solves</span>
    </div>
</a>
