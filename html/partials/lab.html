<div class="lab" data-lab="/api/v1/challenges/{{uuid}}/instance">
    <div class="lab__head">
        <span class="lab__dot" aria-hidden="true"></span>
        <b>Your lab</b>
        <span class="muted small" data-lab-note>{{note}}</span>
    </div>
    <div class="lab__body" data-lab-body>
        <div class="skeleton" style="height:42px"></div>
    </div>
</div>
