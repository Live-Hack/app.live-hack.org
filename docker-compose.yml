services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-livehack}
      DB_USER: ${DB_USER:-livehack}
      DB_PASSWORD: ${DB_PASSWORD:-livehack}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      DATA_DIR: /app/data
      # labs: the app drives Docker through a filtered proxy, never the raw socket
      DOCKER_HOST: tcp://docker-proxy:2375
      INSTANCE_HOST: ${INSTANCE_HOST:-}
      MAX_INSTANCES: ${MAX_INSTANCES:-50}
      LABS_NAMESPACE: ${COMPOSE_PROJECT_NAME:-livehack}
      SWEEP_SECONDS: ${SWEEP_SECONDS:-30}
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped

  # Only the container, network and image APIs are reachable; no exec, no volumes, no swarm.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      EXEC: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-livehack}
      MYSQL_USER: ${DB_USER:-livehack}
      MYSQL_PASSWORD: ${DB_PASSWORD:-livehack}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER:-livehack}", "-p${DB_PASSWORD:-livehack}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
  app-data:
