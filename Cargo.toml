[package]
name = "app_live_hack"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
actix-web = "4.5.1"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = "0.4"
mysql_async = { version = "0.34", features = ["chrono"] }
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
futures = "0.3.30"
qstring = "0.7"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
comrak = { version = "0.24", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
