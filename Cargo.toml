[package]
name = "app_live_hack"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
actix-web = "4.5.1"
serde = "1.0.197"
serde_json = "1.0.114"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1.10.3"
chrono = "0.4"
mysql_async = { version = "0.34", features = ["chrono"] }
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
futures = "0.3.30"
qstring = "0.7"
